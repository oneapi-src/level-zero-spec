--- #--------------------------------------------------------------------------
type: header
desc: "Intel $OneApi Level-Zero Extension for supporting compute graphs."
version: "1.9"
--- #--------------------------------------------------------------------------
type: macro
desc: "Immediate Command List Append Extension Name"
version: "1.9"
name: $X_IMMEDIATE_COMMAND_LIST_APPEND_EXP_NAME
value: '"$X_experimental_immediate_command_list_append"'
--- #--------------------------------------------------------------------------
type: enum
desc: "Immediate Command List Append Extension Version(s)"
version: "1.9"
name: $x_immediate_command_list_append_exp_version_t
etors:
    - name: "1_0"
      value: "$X_MAKE_VERSION( 1, 0 )"
      desc: "version 1.0"
--- #--------------------------------------------------------------------------
type: function
desc: "Appends command lists to dispatch from an immediate command list."
version: "1.9"
class: $xCommandList
name: ImmediateAppendCommandListsExp
details:
    - "@deprecated since 1.16. Please use $xCommandListImmediateAppendCommandListsWithParameters."
    - "The application must call this function only with command lists created with $xCommandListCreateImmediate."
    - "The command lists passed to this function in the `phCommandLists` argument must be regular command lists (i.e. not immediate command lists)."
    - "The application must not call this function from simultaneous threads with the same immediate command list handle."
    - "The command lists are submitted to the device in the order they are received by the driver, whether from multiple calls (on the same or different threads) or a single call with multiple command lists."
    - "The application must ensure the command lists are accessible by the device on which the immediate command list was created."
    - "The application must ensure the device is not currently referencing the appended command list since the implementation is allowed to modify the contents of the command list for submission."
    - "The application must only append command lists created with an identical command queue group ordinal to the immediate command list."
    - "The application must ensure the immediate command list, command lists and events were created on the same context."
    - "The implementation of this function should be lock-free."
params:
    - type: "$x_command_list_handle_t"
      name: hCommandListImmediate
      desc: "[in] handle of the immediate command list"
    - type: uint32_t
      name: numCommandLists
      desc: "[in] number of command lists"
    - type: "$x_command_list_handle_t*"
      name: phCommandLists
      desc: "[in][range(0, numCommandLists)] handles of command lists"
    - type: $x_event_handle_t
      name: hSignalEvent
      desc: |
            [in][optional] handle of the event to signal on completion
                - if not null, this event is signaled after the completion of all appended command lists
    - type: uint32_t
      name: numWaitEvents
      desc: "[in][optional] number of events to wait on before executing appended command lists; must be 0 if nullptr == phWaitEvents"
    - type: "$x_event_handle_t*"
      name: phWaitEvents
      desc: |
            [in][optional][range(0, numWaitEvents)] handles of events to wait on before executing appended command lists.
                - if not null, all wait events must be satisfied prior to the start of any appended command list(s)
--- #--------------------------------------------------------------------------
type: function
desc: "Appends command lists to dispatch from an immediate command list with additional parameters."
version: "1.16"
class: $xCommandList
name: ImmediateAppendCommandListsWithParameters
details:
    - "The application must call this function only with command lists created with $xCommandListCreateImmediate."
    - "The command lists passed to this function in the `phCommandLists` argument must be regular command lists (i.e. not immediate command lists)."
    - "The application must not call this function from simultaneous threads with the same immediate command list handle."
    - "The command lists are submitted to the device in the order they are received by the driver, whether from multiple calls (on the same or different threads) or a single call with multiple command lists."
    - "The application must ensure the command lists are accessible by the device on which the immediate command list was created."
    - "The application must ensure the device is not currently referencing the appended command list since the implementation is allowed to modify the contents of the command list for submission."
    - "The application must only append command lists created with an identical command queue group ordinal to the immediate command list."
    - "The application must ensure the immediate command list, command lists and events were created on the same context."
    - "The implementation of this function should be lock-free."
params:
    - type: "$x_command_list_handle_t"
      name: hCommandListImmediate
      desc: "[in] handle of the immediate command list"
    - type: uint32_t
      name: numCommandLists
      desc: "[in] number of command lists"
    - type: "$x_command_list_handle_t*"
      name: phCommandLists
      desc: "[in][range(0, numCommandLists)] handles of command lists"
    - type: "const void*"
      name: pNext
      desc: "[in][optional] additional extensions passed to the function"
    - type: $x_event_handle_t
      name: hSignalEvent
      desc: |
            [in][optional] handle of the event to signal on completion
                - if not null, this event is signaled after the completion of all appended command lists
    - type: uint32_t
      name: numWaitEvents
      desc: "[in][optional] number of events to wait on before executing appended command lists; must be 0 if nullptr == phWaitEvents"
    - type: "$x_event_handle_t*"
      name: phWaitEvents
      desc: |
            [in][optional][range(0, numWaitEvents)] handles of events to wait on before executing appended command lists.
                - if not null, all wait events must be satisfied prior to the start of any appended command list(s)
returns:
    - $X_RESULT_ERROR_UNSUPPORTED_FEATURE:
        - "an extension passed via pNext is not supported"
