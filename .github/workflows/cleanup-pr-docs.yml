name: Cleanup PR Documentation

# pull_request_target also fires when the PR has merge conflicts, where pull_request
# does not. Safe here: this workflow never checks out or runs PR code.
on:
  pull_request_target:
    types: [closed]

env:
  http_proxy: ${{ vars.CI_HTTP_PROXY }}
  https_proxy: ${{ vars.CI_HTTP_PROXY }}

permissions:
  contents: read

# Same group as this PR's deploy, so closing the PR cancels a deploy in progress.
concurrency:
  group: "pages-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  cleanup-pr-docs:
    runs-on: [self-hosted, Linux]
    permissions:
      contents: write
    if: github.repository_owner == 'intel-innersource'
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages-repo
          clean: false
        continue-on-error: true

      - name: Remove PR documentation
        run: | #bash
          if [ ! -d "gh-pages-repo/.git" ]; then
            echo "gh-pages branch doesn't exist, nothing to clean up"
            exit 0
          fi
          
          cd gh-pages-repo
          
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Determine PR directory name
          PR_DIR="pr-${{ github.event.pull_request.number }}"
          
          # Check if the PR directory exists
          if [ ! -d "$PR_DIR" ]; then
            echo "No documentation found for $PR_DIR, nothing to clean up"
            exit 0
          fi
          
          echo "Removing documentation for $PR_DIR..."
          rm -rf "$PR_DIR"
          
          # Stage only the removed folder; docs-index.yml rebuilds the landing page
          git add -A "$PR_DIR"
          # Commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            if [ "${{ github.event.pull_request.merged }}" = "true" ]; then
              git commit -m "Remove documentation for PR #${{ github.event.pull_request.number }} (merged)"
            else
              git commit -m "Remove documentation for PR #${{ github.event.pull_request.number }} (closed)"
            fi
            # Deploys push to gh-pages at the same time; their folders never overlap.
            for i in 1 2 3 4 5; do
              git push origin gh-pages && break
              [ "$i" = 5 ] && exit 1
              git pull --rebase origin gh-pages || exit 1
            done
            echo "✅ PR documentation cleaned up successfully!"
          fi

      - name: Output cleanup info
        run: | #bash
          echo "🧹 Cleaned up documentation for PR #${{ github.event.pull_request.number }}"
          if [ "${{ github.event.pull_request.merged }}" = "true" ]; then
            echo "   Status: Merged and removed"
          else
            echo "   Status: Closed and removed"
          fi
