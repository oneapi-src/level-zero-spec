--- #--------------------------------------------------------------------------
type: header
desc: "Intel $OneApi Level-Zero Sysman Extension APIs for Device SOC Unique ID"
version: "1.21"
--- #--------------------------------------------------------------------------
type: macro
desc: "Device SOC Unique ID Extension Name"
version: "1.21"
name: $S_DEVICE_SOC_UID_EXT_NAME
value: '"$XS_extension_device_soc_uid"'
--- #--------------------------------------------------------------------------
type: enum
desc: "Device SOC Unique ID Extension Version(s)"
version: "1.21"
name: $s_device_soc_uid_ext_version_t
etors:
    - name: "1_0"
      value: "$X_MAKE_VERSION( 1, 0 )"
      desc: "version 1.0"
      version: "1.21"
--- #--------------------------------------------------------------------------
type: struct
desc: "Device SOC Unique ID Extension structure"
version: "1.21"
class: $sDevice
name: $s_device_soc_uid_ext_properties_t
base: $s_base_properties_t
details:
    - "This structure can be passed as an extension structure to $sDeviceGetProperties via pNext member"
    - "Returns the unique ID of the SOC on which the device resides"
    - "Applications must treat an all-zero socUid as unavailable rather than as a valid identifier"
members:
    - type: $s_uuid_t
      name: socUid
      desc: "[out] unique identifier of the SOC, most significant byte first."
