--- #--------------------------------------------------------------------------
type: header
desc: "Intel $OneApi Level-Zero Extension APIs for NPU Device Properties"
version: "1.18"
--- #--------------------------------------------------------------------------
type: macro
desc: "NPU Device Properties Extension Name"
version: "1.18"
name: $X_DEVICE_NPU_PROPERTIES_EXT_NAME
value: '"$X_extension_device_npu_properties"'
--- #--------------------------------------------------------------------------
type: enum
desc: "NPU Device Properties Extension Version(s)"
version: "1.18"
name: $x_device_npu_properties_ext_version_t
etors:
    - name: "1_0"
      value: "$X_MAKE_VERSION( 1, 0 )"
      desc: "version 1.0"
--- #--------------------------------------------------------------------------
type: struct
desc: "NPU device properties queried using $xDeviceGetProperties"
version: "1.18"
class: $xDevice
name: $x_device_npu_properties_ext_t
base: $x_base_properties_t
members:
    - type: uint32_t
      name: tileCount
      desc: "[out] Total number of NCE tiles enabled on the device. Equivalent to popcount(tileEnableMask). Supersedes the `numSlices` member of $x_device_properties_t for NPU devices."
    - type: uint32_t
      name: tileEnableMask
      desc: "[out] Bitmask of enabled NCE tiles. popcount(tileEnableMask) == tileCount."
    - type: uint32_t
      name: totalShaveCount
      desc: "[out] Total number of SHAVE (VLIW) vector processors across all tiles. Supersedes the `numEUsPerSubslice` member of $x_device_properties_t for NPU devices."
    - type: uint32_t
      name: int8x8MacsPerTile
      desc: "[out] Multiply-accumulate (MAC) units per tile at INT8 x INT8 precision (baseline). Throughput at other precisions: 2x for INT8 x INT4, 0.5x for FP16 x FP16, 0.5x for INT16 x INT8, 1x for INT16 x INT4. Supersedes half the `physicalEUSimdWidth` member of $x_device_properties_t for NPU devices."
    - type: uint32_t
      name: totalDpuMacs
      desc: "[out] Total DPU MAC units across the device. Derived as tileCount * int8x8MacsPerTile."
    - type: uint32_t
      name: numComputeEngines
      desc: "[out] Number of compute engines on the device."
    - type: uint32_t
      name: numCopyEngines
      desc: "[out] Number of copy (DMA) engines on the device."
    - type: uint64_t
      name: dpuClockRateHz
      desc: "[out] DPU compute clock rate, in Hz. Supersedes the `coreClockRate` member of $x_device_properties_t for NPU devices."
    - type: uint64_t
      name: timestampFreqHz
      desc: "[out] Device timestamp counter frequency, in Hz. Used to convert raw device tick counts returned by $xDeviceGetGlobalTimestamps and $xCommandListAppendWriteGlobalTimestamp into time durations."
    - type: uint64_t
      name: nnSramSizeBytes
      desc: "[out] On-chip CMX SRAM size for neural network workloads, in bytes."
details:
    - "This structure may be returned from $xDeviceGetProperties via the `pNext` member of $x_device_properties_t."
    - "Applicable only when the `type` member of $x_device_properties_t is $X_DEVICE_TYPE_VPU."
    - "Exposes NPU-native topology, clock, timestamp frequency, and on-chip SRAM information that has no clean analogue in the GPU-oriented base $x_device_properties_t struct."
    - "The base $x_device_properties_t fields remain populated on NPU devices for backward compatibility with consumers that predate this extension. New consumers should prefer the NPU-native fields exposed here."
    - "Identity (`vendorId`, `deviceId`, `subdeviceId`, `uuid`, `name`), capabilities (`flags`, `maxMemAllocSize`, `maxHardwareContexts`, `maxCommandQueuePriority`), and host/global timestamp validity (`timestampValidBits`) continue to be sourced from the base $x_device_properties_t struct. NPU does not implement kernel timestamp APIs; `kernelTimestampValidBits` is 0 on NPU devices."
