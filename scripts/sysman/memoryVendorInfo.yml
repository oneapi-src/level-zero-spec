--- #--------------------------------------------------------------------------
type: header
desc: "Intel $OneApi Level-Zero Sysman Extension APIs for Memory Vendor Info"
version: "1.18"
--- #--------------------------------------------------------------------------
type: macro
desc: "Memory Vendor Info Extension Name"
version: "1.18"
name: $S_MEMORY_VENDOR_INFO_EXT_NAME
value: '"$XS_extension_memory_vendor_info"'
--- #--------------------------------------------------------------------------
type: enum
desc: "Memory Vendor Info Extension Version(s)"
version: "1.18"
name: $s_memory_vendor_info_ext_version_t
etors:
    - name: "1_0"
      value: "$X_MAKE_VERSION( 1, 0 )"
      desc: "version 1.0"
      version: "1.18"
--- #--------------------------------------------------------------------------
type: macro
desc: "Maximum memory vendor name string size"
version: "1.18"
name: $S_MEMORY_VENDOR_NAME_EXT_SIZE
value: "256"
--- #--------------------------------------------------------------------------
type: struct
desc: "Memory Vendor Info Extension Properties structure"
version: "1.18"
class: $sMemory
name: $s_memory_vendor_info_ext_properties_t
base: $s_base_properties_t
details:
    - "This structure can be passed as an extension structure to $sMemoryGetProperties via pNext member"
    - "Returns the memory vendor ID and the memory vendor name"
members:
    - type: uint32_t
      name: vendorId
      desc: "[out] Memory vendor ID for the device. A value of 0 indicates that the memory vendor ID could not be determined."
    - type: uint16_t
      name: length
      desc: "[out] Length of the memory vendor name, excluding the null terminator. A value of 0 indicates that the memory vendor name could not be determined."
    - type: char
      name: vendorName[$S_MEMORY_VENDOR_NAME_EXT_SIZE]
      desc: "[out] Memory vendor name for the device (NULL terminated string value)."
