--- #--------------------------------------------------------------------------
type: header
desc: "Intel $OneApi Level-Zero Sysman APIs for PCI configuration space and driver PCI device properties"
version: "1.20"
--- #--------------------------------------------------------------------------
type: macro
desc: "PCI Configuration Space Extension Name"
version: "1.20"
name: $S_PCI_CONFIG_EXT_NAME
value: '"$XS_extension_pci_config"'
--- #--------------------------------------------------------------------------
type: enum
desc: "PCI Configuration Space Extension Version(s)"
version: "1.20"
name: $s_pci_config_ext_version_t
etors:
    - name: "1_0"
      value: "$X_MAKE_VERSION( 1, 0 )"
      desc: "version 1.0"
--- #--------------------------------------------------------------------------
type: enum
desc: "Supported PCI link speeds reported by $s_pci_config_ext_properties_t"
version: "1.20"
class: $sDevice
name: $s_pci_link_speed_ext_flags_t
etors:
    - name: GEN1
      desc: "gen 1, 2.5 GT/s, is supported"
    - name: GEN2
      desc: "gen 2, 5 GT/s, is supported"
    - name: GEN3
      desc: "gen 3, 8 GT/s, is supported"
    - name: GEN4
      desc: "gen 4, 16 GT/s, is supported"
    - name: GEN5
      desc: "gen 5, 32 GT/s, is supported"
    - name: GEN6
      desc: "gen 6, 64 GT/s, is supported"
    - name: GEN7
      desc: "gen 7, 128 GT/s, is supported"
--- #--------------------------------------------------------------------------
type: struct
desc: "Identification and link capability registers from the PCI configuration space."
version: "1.20"
class: $sDevice
name: $s_pci_config_ext_properties_t
base: $s_base_properties_t
members:
    - type: uint16_t
      name: "vendorId"
      desc: "[out] The PCI vendor id of the device."
    - type: uint16_t
      name: "deviceId"
      desc: "[out] The PCI device id of the device."
    - type: uint16_t
      name: "subsystemVendorId"
      desc: "[out] The PCI subsystem vendor id of the device."
    - type: uint16_t
      name: "subsystemDeviceId"
      desc: "[out] The PCI subsystem device id of the device."
    - type: uint32_t
      name: "pcieCapabilityVersion"
      desc: "[out] The PCI Express capability version. Zero if the capability could not be read."
    - type: $s_pci_link_speed_ext_flags_t
      name: "supportedLinkSpeeds"
      desc: "[out] The supported link speeds, a combination of $s_pci_link_speed_ext_flag_t. Zero if the capability could not be read."
    - type: uint8_t
      name: "revision"
      desc: "[out] The PCI revision id of the device."
details:
    - "This structure may be passed to $sDevicePciGetProperties via the `pNext` member of $s_pci_properties_t."
    - "This structure is also passed to $sDriverGetPciDeviceProperties, so that PCI properties of supported devices can be queried before device enumeration."
--- #--------------------------------------------------------------------------
type: struct
desc: "PCI device properties queried using $sDriverGetPciDeviceProperties"
version: "1.20"
class: $sDriver
name: $s_driver_pci_device_properties_t
base: $s_base_properties_t
members:
    - type: $s_pci_address_t
      name: "address"
      desc: "[out] The BDF address of the device."
    - type: $s_pci_speed_t
      name: "maxSpeed"
      desc: "[out] Fastest port configuration supported by the device (sum of all lanes). Each member is -1 when it could not be determined."
    - type: $s_pci_config_ext_properties_t
      name: "configProperties"
      desc: "[out] The PCI configuration space properties of the device."
    - type: $s_pci_link_status_t
      name: "status"
      desc: "[out] The link status of the device."
--- #--------------------------------------------------------------------------
type: function
desc: "Get the PCI properties of every device supported by the driver that is present on the PCI bus"
version: "1.20"
class: $sDriver
name: GetPciDeviceProperties
details:
    - "This function reports every device supported by the driver that is present on the PCI bus, whether or not a kernel mode driver is installed or bound to it."
    - "SR-IOV virtual functions are not reported."
    - "This function is supported when $sInit is called with $S_INIT_FLAG_NO_DEVICES."
    - "The application may call this function from simultaneous threads."
params:
    - type: $s_driver_handle_t
      name: hDriver
      desc: "[in] handle of the sysman driver instance"
    - type: "uint32_t*"
      name: pCount
      desc: |
            [in,out] pointer to the number of PCI devices.
            if count is zero, then the driver shall update the value with the total number of PCI devices supported by the driver.
            if count is greater than the number of PCI devices supported by the driver, then the driver shall update the value with the correct number of PCI devices supported by the driver.
    - type: "$s_driver_pci_device_properties_t*"
      name: pProperties
      desc: |
            [in,out][optional][range(0, *pCount)] array of PCI device properties.
            if count is less than the number of PCI devices supported by the driver, then the driver shall only retrieve that number of PCI device properties.
returns:
    - $X_RESULT_ERROR_INVALID_ARGUMENT:
        - "`nullptr != pProperties[i].pNext`, as no extension structures are currently supported."
