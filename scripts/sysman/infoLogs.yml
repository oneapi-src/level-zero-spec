--- #--------------------------------------------------------------------------
type: header
desc: "Intel $OneApi Level-Zero Sysman Extension APIs for Info Logs"
version: "1.19"
--- #--------------------------------------------------------------------------
type: macro
desc: "Info Logs Extension Name"
version: "1.19"
name: $S_INFO_LOGS_EXT_NAME
value: '"$S_extension_info_logs"'
--- #--------------------------------------------------------------------------
type: enum
desc: "Info Logs Extension Version(s)"
version: "1.19"
name: $s_info_logs_ext_version_t
etors:
    - name: "1_0"
      value: "$X_MAKE_VERSION( 1, 0 )"
      desc: "version 1.0"
      version: "1.19"
--- #--------------------------------------------------------------------------
type: handle
desc: "Handle for a Sysman info log"
version: "1.19"
class: $sInfoLog
name: "$s_info_log_handle_t"
--- #--------------------------------------------------------------------------
type: handle
desc: "Handle for a Sysman info log collection instance"
version: "1.19"
class: $sInfoLogInstance
name: "$s_info_log_instance_handle_t"
--- #--------------------------------------------------------------------------
type: enum
desc: "Info log types"
version: "1.19"
class: $sInfoLog
name: $s_info_log_type_ext_t
etors:
    - name: DEVICE
      value: "0"
      desc: "Log of device reported errors and other device reported information."
      version: "1.19"
--- #--------------------------------------------------------------------------
type: enum
desc: "Info log record formats"
version: "1.19"
class: $sInfoLog
name: $s_info_log_format_ext_t
etors:
    - name: CPER
      value: "0"
      desc: "Each record is a UEFI Common Platform Error Record (CPER). The application is responsible for decoding the record contents."
      version: "1.19"
--- #--------------------------------------------------------------------------
type: enum
desc: "Info log record types"
version: "1.19"
class: $sInfoLog
name: $s_info_log_record_type_ext_t
etors:
    - name: UNKNOWN
      value: "0"
      desc: "The type of the record could not be determined."
      version: "1.19"
    - name: INFORMATIONAL
      desc: "The record does not report an error."
      version: "1.19"
    - name: ERROR_CORRECTED
      desc: "The record reports an error that was corrected by the device."
      version: "1.19"
    - name: ERROR_RECOVERABLE
      desc: "The record reports an error that was not corrected by the device and that is not fatal."
      version: "1.19"
    - name: ERROR_FATAL
      desc: "The record reports an error that was not corrected by the device and that is fatal."
      version: "1.19"
--- #--------------------------------------------------------------------------
type: struct
desc: "Info log properties"
version: "1.19"
class: $sInfoLog
name: $s_info_log_ext_properties_t
base: $s_base_properties_t
details:
    - "This structure is returned by $sInfoLogGetPropertiesExt"
members:
    - type: $s_info_log_type_ext_t
      name: infoLogType
      desc: "[out] Type of the information carried by this info log."
    - type: $s_info_log_format_ext_t
      name: infoLogFormat
      desc: "[out] Format of the records returned by this info log."
    - type: $x_bool_t
      name: isNamedInstanceSupported
      desc: |
            [out] Indicates whether named collection instances are supported for this info log.
            If false, then $sInfoLogCreateInstanceExt must be called with `pInstanceName` set to nullptr.
    - type: $x_bool_t
      name: isPeekDataSupported
      desc: |
            [out] Indicates whether the records of this info log can be read without being consumed.
            If false, then $sInfoLogInstancePeekWithMetadataExt shall return $X_RESULT_ERROR_UNSUPPORTED_FEATURE.
--- #--------------------------------------------------------------------------
type: struct
desc: "Info log collection instance descriptor"
version: "1.19"
class: $sInfoLog
name: $s_info_log_instance_ext_desc_t
base: $s_base_desc_t
details:
    - "This structure is passed to $sInfoLogCreateInstanceExt to configure the collection instance."
    - "Each member is optional. If a member is nullptr, then the driver shall use its default value for that setting."
    - "On input, each non-null member points to the value requested by the application. On output, the driver shall update the pointed-to value with the value that was actually applied, which may be rounded to the closest value the driver supports."
members:
    - type: "uint32_t*"
      name: pBufferSizeInKb
      desc: |
            [in,out][optional] pointer to the size, in kilobytes, of the buffer used to collect records.
            if nullptr, then the driver shall use its default buffer size.
            if *pBufferSizeInKb == 0, then implementation shall update pBufferSizeInKb with the default buffer size.
--- #--------------------------------------------------------------------------
type: struct
desc: "Metadata describing a single info log record"
version: "1.19"
class: $sInfoLog
name: $s_info_log_metadata_ext_t
base: $s_base_properties_t
details:
    - "An array of these structures is returned by $sInfoLogInstanceReadWithMetadataExt and by $sInfoLogInstancePeekWithMetadataExt, one element per record."
    - "A record is located within the data buffer returned by those functions using `offset` and `lengthOfData`."
    - "`recordType` is derived by the driver from the contents of the record. The record itself is the authoritative source of this information, and takes precedence if the two disagree."
    - "For an info log whose format is $S_INFO_LOG_FORMAT_EXT_CPER, `recordType` reflects the severity reported in the header of the record. An individual section of that record may report a higher severity than the header does."
    - "The application must treat a value of `recordType` that it does not recognize as $S_INFO_LOG_RECORD_TYPE_EXT_UNKNOWN. The numeric values of $s_info_log_record_type_ext_t do not express an order of severity and must not be compared for magnitude."
members:
    - type: $s_pci_address_t
      name: address
      desc: |
            [out] PCI address of the device that generated the record.
            A value of 0 for `domain`, `bus`, `device`, and `function` indicates that the PCI address could not be determined.
    - type: $s_uuid_t
      name: uuid
      desc: |
            [out] universal unique identifier of the device that generated the record.
            A value of 0 indicates that the UUID could not be determined.
    - type: uint64_t
      name: timestamp
      desc: |
            [out] Time when the record was generated, in nanoseconds.
            The reference point of this timestamp is implementation specific and is only guaranteed to be consistent across records returned by the same info log.
            A value of 0 indicates that the timestamp could not be determined.
    - type: uint32_t
      name: lengthOfData
      desc: "[out] Length of the record, in bytes."
    - type: uint32_t
      name: offset
      desc: "[out] Byte offset of the record from the start of the returned data buffer."
    - type: $s_info_log_record_type_ext_t
      name: recordType
      desc: |
            [out] Type of the information reported by the record.
            $S_INFO_LOG_RECORD_TYPE_EXT_UNKNOWN indicates that the type could not be determined.
--- #--------------------------------------------------------------------------
type: struct
desc: "Status of a read from an info log collection instance"
version: "1.19"
class: $sInfoLog
name: $s_info_log_read_status_ext_t
base: $s_base_properties_t
details:
    - "This structure is optionally returned by $sInfoLogInstanceReadWithMetadataExt and by $sInfoLogInstancePeekWithMetadataExt."
    - "`consumedDataSize` reports the progress made through the data held by the collection instance, which is not related to the amount of record data returned by the call."
members:
    - type: int64_t
      name: droppedRecordCount
      desc: |
            [out] Number of records that were dropped because the collection buffer overflowed.
            A value of `-1` indicates that one or more records were dropped and that their number could not be determined.
            The application must check whether $sInfoLogInstanceReadWithMetadataExt or $sInfoLogInstancePeekWithMetadataExt returned $X_RESULT_WARNING_DROPPED_DATA before inspecting `droppedRecordCount`, since a value of `0` is otherwise ambiguous between no records dropped and the status not having been reported.
    - type: uint64_t
      name: consumedDataSize
      desc: |
            [out] Number of bytes that this call read out of the data held by the collection instance.
            This value counts all of the data that was searched, including data that does not belong to a record, and is therefore not related to the size of the record data returned by the call.
            For $sInfoLogInstanceReadWithMetadataExt, this data is consumed and shall not be searched again by a subsequent call.
            If consumedDataSize = 0, then $sInfoLogInstanceReadWithMetadataExt did not consume any data, similar to $sInfoLogInstancePeekWithMetadataExt.
    - type: $x_bool_t
      name: hasDataToRead
      desc: |
            [out] Indicates whether the collection instance holds records that were not returned by this call.
            This is true when the call stopped before all records were examined, for example because `timeout` elapsed, because `pBuffer` or `pDescriptors` was too small to hold all of the records that were found, or because the next record available was larger than `*pSize`.
            This value is a hint. Records may be collected, and for $sInfoLogInstanceReadWithMetadataExt consumed, after this function returns.
--- #--------------------------------------------------------------------------
type: function
desc: "Get handles to the info logs supported by the driver"
version: "1.19"
class: $sDriver
name: EnumInfoLogsExt
details:
    - "An info log is a driver scoped object. Records collected from an info log may originate from any of the devices managed by the driver, and the originating device is reported in the metadata of each record."
    - "The application should first call this function with `pCount` pointing to a value of zero to retrieve the number of info logs available."
    - "Multiple calls to this function will return identical info log handles, in the same order."
    - "The application may call this function from simultaneous threads."
    - "The implementation of this function should be lock-free."
params:
    - type: $s_driver_handle_t
      name: hDriver
      desc: "[in] handle of the driver instance"
    - type: "uint32_t*"
      name: pCount
      desc: |
            [in,out] pointer to the number of info logs.
            if count is zero, then the driver shall update the value with the total number of info logs available.
            if count is greater than the number of info logs available, then the driver shall update the value with the correct number of info logs available.
    - type: "$s_info_log_handle_t*"
      name: phInfoLogs
      desc: |
            [in,out][optional][range(0, *pCount)] array of info log handles.
            if count is less than the number of info logs available, then the driver shall only retrieve that number of info log handles.
--- #--------------------------------------------------------------------------
type: function
desc: "Get info log properties"
version: "1.19"
class: $sInfoLog
name: GetPropertiesExt
details:
    - "The application may call this function from simultaneous threads."
    - "The implementation of this function should be lock-free."
params:
    - type: $s_info_log_handle_t
      name: hInfoLog
      desc: "[in] handle of the info log"
    - type: "$s_info_log_ext_properties_t*"
      name: pProperties
      desc: "[in,out] Will contain the properties of the info log."
--- #--------------------------------------------------------------------------
type: function
desc: "Create a collection instance for an info log"
version: "1.19"
class: $sInfoLog
name: CreateInstanceExt
details:
    - "Creating a collection instance starts the collection of records into a buffer owned by that instance."
    - "Records collected by an instance are retrieved using $sInfoLogInstanceReadWithMetadataExt, or inspected without being consumed using $sInfoLogInstancePeekWithMetadataExt."
    - "Collection continues until the instance is deleted using $sInfoLogInstanceDeleteExt, which also releases the resources allocated by the instance during create operation."
    - "A named collection instance collects records into a buffer that is not shared with other collection instances. Named collection instances are only supported when isNamedInstanceSupported of $s_info_log_ext_properties_t is true."
    - "If `pInstanceName` is nullptr, then records are collected from the default/global buffer of the info log, which may be shared with other consumers and can have data from different sources."
    - "The application must not call this function from simultaneous threads."
    - "The implementation of this function should be lock-free."
params:
    - type: $s_info_log_handle_t
      name: hInfoLog
      desc: "[in] handle of the info log"
    - type: "const char*"
      name: pInstanceName
      desc: |
            [in][optional] name of the collection instance to create.
            if nullptr, then the default buffer of the info log shall be used.
    - type: "$s_info_log_instance_ext_desc_t*"
      name: pDesc
      desc: "[in,out] pointer to the descriptor of the collection instance to create."
    - type: "$s_info_log_instance_handle_t*"
      name: phInfoLogInstance
      desc: "[out] handle of the collection instance that was created."
returns:
    - $X_RESULT_ERROR_UNSUPPORTED_FEATURE:
        - "`pInstanceName != nullptr` and isNamedInstanceSupported of $s_info_log_ext_properties_t is false."
    - $X_RESULT_ERROR_HANDLE_OBJECT_IN_USE:
        - "A collection instance was already created with the same name."
    - $X_RESULT_ERROR_INSUFFICIENT_PERMISSIONS:
        - "User does not have permissions to collect info log records."
--- #--------------------------------------------------------------------------
type: function
desc: "Read collected info log records and their metadata"
version: "1.19"
class: $sInfoLogInstance
name: ReadWithMetadataExt
details:
    - "A call in which `*pSize` is zero or `*pRecordCount` is zero on input is a query call. A query call reports the total size, in bytes, of the record data and the total number of records that were found, does not write to `pBuffer` or `pDescriptors`, and does not consume any record. `pBuffer` and `pDescriptors` may be nullptr on a query call and are otherwise ignored by it."
    - "The application can optionally make a query call first to determine the size of the buffer and the number of descriptors it must provide."
    - "Records are consumed as they are returned. A record returned by one call will not be returned again by a subsequent call."
    - "$sInfoLogInstancePeekWithMetadataExt returns the same records without consuming them."
    - "This function searches the data held by the collection instance for records. The amount of data that must be searched is not related to the amount of record data returned, because the collection instance may hold a large amount of data that contains no record. `timeout` bounds the search and applies to the query call as well."
    - "`hasDataToRead` in $s_info_log_read_status_ext_t reports whether records remain, and is the value the application should use to decide whether to call this function again."    
    - "The application must not call this function from simultaneous threads."
    - "The implementation of this function should be lock-free."
params:
    - type: $s_info_log_instance_handle_t
      name: hInfoLogInstance
      desc: "[in] handle of the info log collection instance"
    - type: uint64_t
      name: timeout
      desc: |
            [in] maximum time, in milliseconds, that this function may spend searching the collection instance for records.
            if zero, then the function shall return immediately without searching.
            if `UINT64_MAX`, then the function shall not return until it has searched all of the data held by the collection instance.
            when this time elapses, the function shall return $X_RESULT_SUCCESS with the records it has found so far, which may be none.
            due to external dependencies, timeout may be rounded to the closest value allowed by the accuracy of those dependencies.
    - type: "uint32_t*"
      name: pSize
      desc: |
            [in,out] pointer to the size, in bytes, of the record data.
            on input, the value is the size of `pBuffer`.
            if the value is zero, or if `*pRecordCount` is zero, then this is a query call: the driver shall update the value with the total size of the record data that was found and shall not consume any record.
            otherwise, on output the driver shall update the value with the size of the record data written to `pBuffer`.
    - type: "uint8_t*"
      name: pBuffer
      desc: |
            [in,out][optional][range(0, *pSize)] buffer that will contain the record data.
            the driver shall not write to this buffer on a query call, and the application may pass nullptr for such a call.
    - type: "uint32_t*"
      name: pRecordCount
      desc: |
            [in,out] pointer to the number of records.
            on input, the value is the number of elements in `pDescriptors`.
            if the value is zero, or if `*pSize` is zero, then this is a query call: the driver shall update the value with the total number of records that were found and shall not consume any record.
            otherwise, on output the driver shall update the value with the number of records written to `pDescriptors`.
    - type: "$s_info_log_metadata_ext_t*"
      name: pDescriptors
      desc: |
            [in,out][optional][range(0, *pRecordCount)] array of metadata describing each record written to `pBuffer`.
            the driver shall not write to this array on a query call, and the application may pass nullptr for such a call.
            the application must initialize the stype member of each element in the array.
    - type: "$s_info_log_read_status_ext_t*"
      name: pReadStatus
      desc: |
            [in,out][optional] pointer to a structure that will contain the status of this call.
            if nullptr, then the driver shall not report the status of this call, and the application cannot determine whether records were dropped or whether records remain available.
            the application must initialize the stype member.
returns:
    - $X_RESULT_WARNING_DROPPED_DATA:
        - "One or more records were dropped because the collection buffer overflowed. The number of records dropped is reported in $s_info_log_read_status_ext_t."
    - $X_RESULT_ERROR_INSUFFICIENT_PERMISSIONS:
        - "User does not have permissions to read info log records."
--- #--------------------------------------------------------------------------
type: function
desc: "Read collected info log records and their metadata without consuming them"
version: "1.19"
class: $sInfoLogInstance
name: PeekWithMetadataExt
details:
    - "This function is equivalent to $sInfoLogInstanceReadWithMetadataExt, except that the records it returns are not consumed and remain available to subsequent calls to either function."
    - "Reading records without consuming them is only supported when isPeekDataSupported of $s_info_log_ext_properties_t is true."
    - "As with $sInfoLogInstanceReadWithMetadataExt, a call in which `*pSize` is zero or `*pRecordCount` is zero on input is a query call, which reports the total size, in bytes, of the record data and the total number of records that were found without writing to `pBuffer` or `pDescriptors`."
    - "The application should then call this function with `*pSize` and `*pRecordCount` both non-zero to inspect the records that are available."
    - "The application must not call this function from simultaneous threads."
    - "The application must not call this function and $sInfoLogInstanceReadWithMetadataExt simultaneously with the same handle."
params:
    - type: $s_info_log_instance_handle_t
      name: hInfoLogInstance
      desc: "[in] handle of the info log collection instance"
    - type: uint64_t
      name: timeout
      desc: |
            [in] maximum time, in milliseconds, that this function may spend searching the collection instance for records.
            if zero, then the function shall return immediately without searching.
            if `UINT64_MAX`, then the function shall not return until it has searched all of the data held by the collection instance.
            when this time elapses, the function shall return $X_RESULT_SUCCESS with the records it has found so far, which may be none.
            due to external dependencies, timeout may be rounded to the closest value allowed by the accuracy of those dependencies.
    - type: "uint32_t*"
      name: pSize
      desc: |
            [in,out] pointer to the size, in bytes, of the record data.
            on input, the value is the size of `pBuffer`.
            if the value is zero, or if `*pRecordCount` is zero, then this is a query call: the driver shall update the value with the total size of the record data that was found.
            otherwise, on output the driver shall update the value with the size of the record data written to `pBuffer`.
    - type: "uint8_t*"
      name: pBuffer
      desc: |
            [in,out][optional][range(0, *pSize)] buffer that will contain the record data.
            the driver shall not write to this buffer on a query call, and the application may pass nullptr for such a call.
    - type: "uint32_t*"
      name: pRecordCount
      desc: |
            [in,out] pointer to the number of records.
            on input, the value is the number of elements in `pDescriptors`.
            if the value is zero, or if `*pSize` is zero, then this is a query call: the driver shall update the value with the total number of records that were found.
            otherwise, on output the driver shall update the value with the number of records written to `pDescriptors`.
    - type: "$s_info_log_metadata_ext_t*"
      name: pDescriptors
      desc: |
            [in,out][optional][range(0, *pRecordCount)] array of metadata describing each record written to `pBuffer`.
            the driver shall not write to this array on a query call, and the application may pass nullptr for such a call.
            the application must initialize the stype member of each element in the array.
    - type: "$s_info_log_read_status_ext_t*"
      name: pReadStatus
      desc: |
            [in,out][optional] pointer to a structure that will contain the status of this call.
            if nullptr, then the driver shall not report the status of this call, and the application cannot determine whether records were dropped or whether records remain available.
            the application must initialize the stype member.
returns:
    - $X_RESULT_ERROR_UNSUPPORTED_FEATURE:
        - "isPeekDataSupported of $s_info_log_ext_properties_t is false."
    - $X_RESULT_WARNING_DROPPED_DATA:
        - "One or more records were dropped because the collection buffer overflowed. The number of records dropped is reported in $s_info_log_read_status_ext_t."
    - $X_RESULT_ERROR_INSUFFICIENT_PERMISSIONS:
        - "User does not have permissions to read info log records."
--- #--------------------------------------------------------------------------
type: function
desc: "Delete a collection instance of an info log"
version: "1.19"
class: $sInfoLogInstance
name: DeleteExt
details:
    - "Deleting a collection instance stops the collection of records into that instance and releases the resources used by the instance."
    - "The application must ensure that no other function is using the handle when calling this function."
    - "The application must not call this function from simultaneous threads with the same handle."
    - "The implementation of this function must be thread-safe."
params:
    - type: $s_info_log_instance_handle_t
      name: hInfoLogInstance
      desc: "[in][release] handle of the info log collection instance to delete"
--- #--------------------------------------------------------------------------
type: class
desc: "C++ wrapper for a Sysman info log"
version: "1.19"
name: $sInfoLog
owner: $sDriver
members:
    - type: $s_info_log_handle_t
      name: handle
      desc: "[in] handle of Sysman info log object"
--- #--------------------------------------------------------------------------
type: class
desc: "C++ wrapper for a Sysman info log collection instance"
version: "1.19"
name: $sInfoLogInstance
owner: $sInfoLog
members:
    - type: $s_info_log_instance_handle_t
      name: handle
      desc: "[in] handle of Sysman info log collection instance object"
