--- #--------------------------------------------------------------------------
type: header
desc: "Intel $OneApi Level-Zero Tool APIs for System Resource Management (Sysman)"
ordinal: "1"
--- #--------------------------------------------------------------------------
type: enum
desc: "Supported sysman initialization flags"
version: "1.5"
class: $s
name: $s_init_flags_t
etors:
    - name: GPU_ONLY
      desc: "Initialize sysman for GPU devices only"
      value: $X_BIT(0)
      version: "1.18"
    - name: VPU_ONLY
      desc: "Initialize sysman for VPU devices only"
      value: $X_BIT(1)
      version: "1.18"
    - name: NO_DEVICES
      desc: "Allows $sInit() to succeed when no devices are discovered.
             Device discovery is deferred until the first call to $sDeviceGet(),
             in case no devices can be discovered when $sInit() is called."
      value: $X_BIT(2)
      version: "1.18"
--- #--------------------------------------------------------------------------
type: function
desc: "Initialize $OneApi System Resource Management (sysman)"
version: "1.5"
class: $s
name: Init
decl: static
ordinal: "0"
details: 
    - "The application must call zesInit() before calling any other sysman function."
    - "1.16": "The `ZES_ENABLE_SYSMAN` environment variable method of initialization is deprecated. Applications should use zesInit() instead."
    - "If this function is not called then all other sysman functions will return $X_RESULT_ERROR_UNINITIALIZED."
    - "This function will only initialize sysman. To initialize other functions, call $xInit."
    - "There is no requirement to call this function before or after $xInit."
    - "Only one instance of sysman will be initialized per process."
    - "The application must call this function after forking new processes. Each forked process must call this function."
    - "The application may call this function from simultaneous threads."
    - "The implementation of this function must be thread-safe for scenarios where multiple libraries may initialize sysman simultaneously."
params:
    - type: $s_init_flags_t
      name: flags
      desc: |
            [in] initialization flags. This should be 0 or a combination of $s_init_flags_t values.
      init: "0"
returns:
    - $X_RESULT_ERROR_OUT_OF_HOST_MEMORY
--- #--------------------------------------------------------------------------
type: function
desc: "Retrieves sysman driver instances"
version: "1.5"
class: $sDriver
name: Get
decl: static
ordinal: "0"
details:
    - "A sysman driver represents a collection of physical devices."
    - "Multiple calls to this function will return identical sysman driver handles, in the same order."
    - "The application may pass nullptr for pDrivers when only querying the number of sysman drivers."
    - "The application may call this function from simultaneous threads."
    - "The implementation of this function should be lock-free."
params:
    - type: "uint32_t*"
      name: pCount
      desc: |
            [in,out] pointer to the number of sysman driver instances.
            if count is zero, then the loader shall update the value with the total number of sysman drivers available.
            if count is greater than the number of sysman drivers available, then the loader shall update the value with the correct number of sysman drivers available.
    - type: "$s_driver_handle_t*"
      name: phDrivers
      desc: |
            [in,out][optional][range(0, *pCount)] array of sysman driver instance handles.
            if count is less than the number of sysman drivers available, then the loader shall only retrieve that number of sysman drivers.
--- #--------------------------------------------------------------------------
type: macro
desc: "Maximum system driver version string size"
version: "1.19"
name: $S_MAX_SYSTEM_DRIVER_VERSION
value: "256"
--- #--------------------------------------------------------------------------
type: struct
desc: "Sysman driver properties queried using $sDriverGetProperties"
version: "1.19"
class: $sDriver
name: $s_driver_properties_t
base: $s_base_properties_t
members:
    - type: $s_uuid_t
      name: uuid
      desc: "[out] universal unique identifier of the sysman driver instance."
    - type: uint32_t
      name: driverVersion
      desc: |
        [out] sysman driver version
        The sysman driver version is a non-zero, monotonically increasing value where higher values always indicate a more recent version.
--- #--------------------------------------------------------------------------
type: function
desc: "Retrieves properties of the sysman driver."
version: "1.19"
class: $sDriver
name: GetProperties
ordinal: "1"
details:
    - "The application may call this function from simultaneous threads."
    - "The implementation of this function should be lock-free."
params:
    - type: $s_driver_handle_t
      name: hDriver
      desc: "[in] handle of the sysman driver instance"
    - type: "$s_driver_properties_t*"
      name: pDriverProperties
      desc: "[in,out] query result for sysman driver properties"
