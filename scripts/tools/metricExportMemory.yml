--- #--------------------------------------------------------------------------
type: header
desc: "Intel $OneApi Level-Zero Tool Experimental Extension for Metrics/Metric Groups which export Memory"
version: "1.11"
--- #--------------------------------------------------------------------------
type: macro
desc: "Metric Export Memory Experimental Extension Name"
version: "1.11"
name: $T_METRIC_EXPORT_MEMORY_EXP_NAME
value: '"$XT_experimental_metric_export_memory"'
--- #--------------------------------------------------------------------------
type: enum
desc: "Metric Export Memory Experimental Extension Version(s)"
version: "1.11"
name: $t_metric_export_memory_exp_version_t
etors:
    - name: "1_0"
      value: "$X_MAKE_VERSION( 1, 0 )"
      desc: "version 1.0"
--- #--------------------------------------------------------------------------
type: enum
desc: "Metric group type"
version: "1.13"
class: $tMetricGroup
name: $t_metric_group_type_exp_flags_t
etors:
    - name: EXPORT_DMA_BUF
      desc: 
            Metric group and metrics exports memory using linux dma-buf, which could be imported/mapped to the host process.
            Properties of the dma_buf could be queried using $t_export_dma_buf_exp_properties_t.
    - name: USER_CREATED
      desc: "Metric group created using $tDeviceCreateMetricGroupsFromMetricsExp"
    - name: OTHER
      desc: "Metric group which has a collection of metrics"
    - name: MARKER
      desc: "Metric group is capable of generating Marker metric"
--- #--------------------------------------------------------------------------
type: struct
desc: "Query the metric group type using `pNext` of $t_metric_group_properties_t"
class: $tMetricGroup
name: $t_metric_group_type_exp_t
base: $t_base_properties_t
members:
    - type: "$t_metric_group_type_exp_flags_t"
      name: "type"
      desc: |
            [out] metric group type.
            returns a combination of $t_metric_group_type_exp_flags_t.
--- #--------------------------------------------------------------------------
type: struct
desc: "Exported dma_buf properties queried using `pNext` of $t_metric_group_properties_t or $t_metric_properties_t"
class: $tMetric
name: $t_export_dma_buf_exp_properties_t
base: $t_base_properties_t
members:
    - type: int
      name: "fd"
      desc: |
            [out] the file descriptor handle provided for importing memory by the host process.
            Owned by the implementation; must not be closed by the application.
    - type: size_t
      name: "size"
      desc: "[out] size in bytes of the dma_buf"
details:
    - "This structure must be passed via the `pNext` member of $t_metric_group_properties_t or $t_metric_properties_t"
    - "The implementation retains ownership of `fd` for its entire lifetime. The application must not close `fd`; it is closed by the implementation when the metric or metric group that exported it is destroyed, or when metrics are disabled on the device."
    - "The application must free any allocation it imported from `fd` before destroying the exporting metric or metric group, or disabling metrics on the device. Otherwise the imported allocation outlives `fd` and any subsequent use of it is undefined."
    - "`fd` refers to a shared resource. The same `fd` may be reported by repeated queries and by queries on different metric or metric group handles. The implementation performs no synchronization on `fd` or on the memory it exports; if the application uses either from more than one thread it must serialize that access itself, for example with a mutex or by confining access to a single thread."
